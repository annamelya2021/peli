<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Redirecting...</title>
    <script>
      // Перенаправлення на /superpeli/ з підтримкою внутрішніх шляхів
      const path = window.location.pathname;
      if (path.startsWith('/superpeli')) {
        window.location.href = '/superpeli/#' + path.replace('/superpeli', '');
      } else {
        window.location.href = '/superpeli/';
      }
    </script>
  </head>
  <body>
    <h1>Redirecting...</h1>
    <a href="/superpeli/">Click here if you are not redirected</a>
  </body>
</html>
